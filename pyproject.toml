[project]
name = "arbor"
version = "0.1.0"
description = "A PyQt mind map editor with XMind-style key bindings"
readme = "README.md"
authors = [
    { name = "Node Sans", email = "node189@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pyqt6>=6.11.0",
]

[project.scripts]
arbor = "arbor:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
