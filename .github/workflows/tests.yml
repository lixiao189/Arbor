name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Libraries the PyQt6 wheels load even on the offscreen platform.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --locked pytest

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # ty is pinned in uv.lock; the synced venv provides PyQt6's stubs.
      - name: Run ty
        run: uv run --locked ty check
