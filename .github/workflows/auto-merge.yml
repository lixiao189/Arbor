name: Auto-merge

# Turns on GitHub auto-merge for the repository owner's own PRs, so they merge
# as soon as master's required checks pass. Other authors' PRs are left alone.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.user.login == github.repository_owner && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
