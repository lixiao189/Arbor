name: Build

# Builds the Python distributions and the app bundles for every platform.
# Called by the nightly and release workflows, and run on its own for every
# pull request (its jobs are required checks on master).
on:
  pull_request:
  workflow_call:

jobs:
  python-dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  app:
    name: app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Needs Xcode 26+ to compile the Icon Composer icon (packaging/icon/Arbor.icon).
          - os: macos-26
            name: macos-arm64
            exe: dist/Arbor.app/Contents/MacOS/Arbor
          - os: windows-2022
            name: windows-x86_64
            exe: dist/Arbor/Arbor.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Build app bundle
        shell: bash
        run: >
          uv run --locked --with pyinstaller
          pyinstaller --noconfirm packaging/arbor.spec

      # The spec falls back to the .icns alone without Xcode 26; make sure CI
      # never ships that fallback.
      - name: Check Liquid Glass icon (macOS)
        if: runner.os == 'macOS'
        run: |
          test -f dist/Arbor.app/Contents/Resources/Assets.car
          test "$(plutil -extract CFBundleIconName raw dist/Arbor.app/Contents/Info.plist)" = Arbor
          xcrun assetutil --info dist/Arbor.app/Contents/Resources/Assets.car

      - name: Smoke test
        shell: bash
        run: uv run --no-project python packaging/smoke_test.py "${{ matrix.exe }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Arbor.app "Arbor-${{ matrix.name }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Arbor -DestinationPath "Arbor-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: Arbor-${{ matrix.name }}.*

  # Linux ships as a Flatpak bundle, built from packaging/flatpak.
  flatpak:
    name: flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    env:
      APP_ID: io.github.lixiao189.Arbor
      FLATHUB: https://dl.flathub.org/repo/flathub.flatpakrepo
      BUNDLE: Arbor-linux-${{ matrix.arch }}.flatpak
    steps:
      - uses: actions/checkout@v7

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb dbus
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub "$FLATHUB"

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo=repo build-dir "packaging/flatpak/$APP_ID.yml"
          # --runtime-repo lets `flatpak install` fetch the runtime from Flathub.
          flatpak build-bundle --runtime-repo="$FLATHUB" repo "$BUNDLE" "$APP_ID"

      - name: Smoke test
        run: |
          flatpak install --user -y --noninteractive --bundle "$BUNDLE"
          xvfb-run -a dbus-run-session -- \
            python3 packaging/smoke_test.py flatpak run "$APP_ID"

      - uses: actions/upload-artifact@v7
        with:
          name: app-linux-${{ matrix.arch }}
          path: ${{ env.BUNDLE }}
