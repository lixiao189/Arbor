name: Build

# Builds the Python distributions and the app bundles for every platform.
# Called by the nightly and release workflows, and run on its own for every
# pull request (its jobs are required checks on master).
on:
  pull_request:
  workflow_call:

jobs:
  python-dist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            exe: dist/Arbor/Arbor
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            exe: dist/Arbor/Arbor
          - os: macos-14
            name: macos-arm64
            exe: dist/Arbor.app/Contents/MacOS/Arbor
          - os: windows-2022
            name: windows-x86_64
            exe: dist/Arbor/Arbor.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Build app bundle
        shell: bash
        run: >
          uv run --locked --with pyinstaller
          pyinstaller --noconfirm packaging/arbor.spec

      # A virtual X server plus the libraries Qt's xcb platform plugin loads.
      - name: Install display for smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libfontconfig1 libdbus-1-3 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0

      - name: Smoke test
        shell: bash
        run: |
          run=(uv run --no-project python packaging/smoke_test.py "${{ matrix.exe }}")
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a "${run[@]}"); fi
          "${run[@]}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Arbor.app "Arbor-${{ matrix.name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "Arbor-${{ matrix.name }}.tar.gz" -C dist Arbor

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Arbor -DestinationPath "Arbor-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: Arbor-${{ matrix.name }}.*
