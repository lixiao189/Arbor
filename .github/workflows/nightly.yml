name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Scheduled runs skip the build when the nightly release already points at
  # this commit; manual runs always build.
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          built=$(gh api "repos/$GH_REPO/commits/nightly" -q .sha 2>/dev/null || true)
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$built" != "$GITHUB_SHA" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nightly already built from $GITHUB_SHA, skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # A single rolling "nightly" pre-release, replaced on every run.
      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly artifacts/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Arbor nightly ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Automated alpha build of master at $GITHUB_SHA. Replaced every night."
