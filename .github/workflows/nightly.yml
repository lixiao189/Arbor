name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Libraries the PyQt6 wheels load even on the offscreen platform.
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Run tests
        run: uv run --locked pytest

  python-dist:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build wheel and sdist
        run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*

  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: macos-14
            name: macos-arm64
          - os: windows-2022
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Write launcher script
        shell: bash
        run: printf 'from arbor import main\n\nmain()\n' > launcher.py

      - name: Build app bundle
        shell: bash
        run: >
          uv run --locked --with pyinstaller
          pyinstaller --noconfirm --windowed --name Arbor launcher.py

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Arbor.app "Arbor-${{ matrix.name }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "Arbor-${{ matrix.name }}.tar.gz" -C dist Arbor

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Arbor -DestinationPath "Arbor-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: Arbor-${{ matrix.name }}.*

  release:
    needs: [python-dist, app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # A single rolling "nightly" pre-release, replaced on every run.
      - name: Publish nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly artifacts/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Arbor nightly ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Automated alpha build of master at $GITHUB_SHA. Replaced every night."
